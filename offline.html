<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline | Cold Caller Guide</title>
<meta name="theme-color" content="#0A4D53">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.55;
    background:#0A4D53;color:#fff;text-align:center}
  main{max-width:420px}
  img{border-radius:20px;margin-bottom:16px}
  h1{font-size:1.5rem;margin:0 0 8px}
  p{margin:0 0 24px;color:#CFE9E6}
  button{min-height:48px;padding:12px 28px;border:0;border-radius:10px;background:#13A89E;color:#06302D;font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#2DC4B8}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="./icons/icon-96.png" alt="" width="96" height="96">
  <h1>You're offline</h1>
  <p>This page isn't saved on your device yet. Reconnect and tap retry. Pages you've already opened still work offline.</p>
  <button type="button" onclick="location.href='./index.html'">Retry</button>
</main>
</body>
</html>
